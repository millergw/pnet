name: pnet
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.9.7
  - captum
  - pip
  - pip:
      - ConfigArgParse==1.7
      - matplotlib==3.5
      - networkx==2.8.4
      - numpy==1.23.3
      - pandas==1.4.4
      - pytorch-lightning==2.0.2
      - PyYAML==6.0
      - scikit_learn==1.1.3
      - torch==1.13.1
      - torch-geometric==2.2.0
      - torchmetrics==0.11.4
      - tqdm==4.64.1
      - wandb==0.15.3

